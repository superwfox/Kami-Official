name: Restart Run Bot once
on:
  push:
    branches: [master]
    paths: ['.github/workflows/restart-runbot-once.yml']
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for helper cleanup then start latest master
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for attempt in {1..24}; do
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/restart-runbot-once.yml?ref=master" --silent 2>/dev/null; then
              gh workflow run run.yml --repo "$GITHUB_REPOSITORY" --ref master -f minutes=300
              exit 0
            fi
            sleep 5
          done
          echo '::error::Temporary helper cleanup did not complete'
          exit 1
